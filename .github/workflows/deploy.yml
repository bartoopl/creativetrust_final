# Test, build the Docker image, push it to GHCR and tell the server's panel to
# redeploy. Pull requests run the checks and the image build without pushing.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_WEBHOOK_URL    the panel's deploy webhook (Coolify: Webhooks → Deploy;
#                         Dokploy: application → Deployments → Webhook URL)
#   DEPLOY_WEBHOOK_TOKEN  optional bearer token (Coolify API token); leave unset for Dokploy
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Site image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tools image (one-off Payload commands)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:tools
          cache-from: type=gha

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the panel
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$URL" ]; then echo "DEPLOY_WEBHOOK_URL not set — image pushed, deploy skipped."; exit 0; fi
          if [ -n "$TOKEN" ]; then
            curl --fail-with-body -sS -X GET "$URL" -H "Authorization: Bearer $TOKEN"
          else
            curl --fail-with-body -sS -X POST "$URL"
          fi
