[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Domena bez www → https://www jednym skokiem 301 (WEW-17), także z http://.
# Cel to zawsze inny host, więc reguły nie zapętlą się w żadnym trybie SSL
# Cloudflare. http://www → https://www robi przekierowanie HTTPS Netlify/Cloudflare.
[[redirects]]
  from = "http://creativetrust.pl/*"
  to = "https://www.creativetrust.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://creativetrust.pl/*"
  to = "https://www.creativetrust.pl/:splat"
  status = 301
  force = true

# Przekierowanie API do funkcji Netlify
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Zmienne środowiskowe
[build.environment]
  NETLIFY = "true"

# Ustawienia funkcji
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Funkcja zaplanowana do codziennej synchronizacji danych reklamowych
[functions."scheduled-sync"]
  schedule = "@daily"